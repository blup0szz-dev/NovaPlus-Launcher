name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Locate project
        run: |
          if [ -f settings.gradle.kts ]; then
            PROJ="$PWD"
          else
            ZIP=$(git ls-files '*.zip' | while read -r z; do echo "$(git log -1 --format=%ct -- "$z") $z"; done | sort -n | tail -1 | cut -d' ' -f2-)
            if [ -z "$ZIP" ]; then echo "Repoda proje de zip de yok"; exit 1; fi
            echo "Kullanilan zip: $ZIP"
            mkdir -p /tmp/proj
            unzip -o -q "$ZIP" -d /tmp/proj
            PROJ=$(dirname "$(find /tmp/proj -name settings.gradle.kts | head -n 1)")
          fi
          echo "Proje klasoru: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
